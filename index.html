<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8">
	<title>RBXM2ANIM</title>
</head>
<style>
  body {
    padding: 3px;
  }
  #log {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    overflow: auto;
    scrollbar-width: none;      
    -ms-overflow-style: none;  
  }
  #log::-webkit-scrollbar {
    display: none; 
  }
</style>
<body>
	<header>
    	<input type="file" id="f" accept=".rbxm,.rbxmx" multiple>
	</header>
  	<main>
    	<pre id="log"></pre>
  	</main>
	<script src="./pyodide/pyodide.js"></script>
	<script type="module">
		const log = document.getElementById("log");
		const print = s => log.textContent += s + "\n";
		let pyo;
		async function GP() {
			if (pyo) return pyo;
			pyo = await loadPyodide();
			pyo.setStdout({ batched: print });
			pyo.setStderr({ batched: print });
			pyo.runPython(await (await fetch("converter.py")).text());
			return pyo;
		}
		const pyodide = await GP()
		document.getElementById("f").onchange = async e => {
			const files = e.target.files;
			if (!files.length) return;
			for (const file of files) {
			const buf = new Uint8Array(await file.arrayBuffer());
			const result = pyodide.globals.get("main")(pyodide.toPy(buf), undefined);
			if (result.get("status") === "pick") {
				const options = result.get("options").toJs({ create_proxies: false });
				const i = prompt("YOUR selection:\n" + options.map((o, i) => `${i}: ${o.get("name")}`).join("\n"));
				const idx = parseInt(i);
				if (i === null || isNaN(idx)) continue;
				download(pyodide.globals.get("main")(pyodide.toPy(buf), idx).get("data"), file.name);
			} else if (result.get("status") === "Error") {
				print(result.get("error"));
				continue;
			} else {
				download(result.get("data"), file.name);
			}
			}
		};
		function download(bytes, filename) {
    		const a = document.createElement("a");
    		a.href = URL.createObjectURL(new Blob([bytes.toJs()], { type: "application/octet-stream" }));
    		a.download = filename.replace(/\.[^.]+$/, "") + ".anim";
    		a.click();
    		print(a.download);
		}
	</script>
</body>
</html>
