<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RBXM2ANIM</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --neutral: #21262d;
      --neutral-hover: #30363d;
    }
    @font-face {
      font-family: "Droid Sans Mono";
      src: local("Droid Sans Mono"), url("DroidSansMono.ttf") format("truetype");
      font-display: swap;
    }

    html, body { margin: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { padding: 24px; max-width: 1400px; margin: 0 auto; color: var(--text); font-size: 14px; line-height: 1.5; }

    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .title-group h1 { margin: 0; font-size: 20px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
    .title-group p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); }

    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; text-decoration: none; border: 1px solid rgba(240,246,252,0.1); padding: 8px 16px; border-radius: 6px; font-weight: 500; font-size: 13px; font-family: inherit; transition: background 0.15s ease; box-shadow: 0 1px 0 rgba(27,31,35,0.1); }
    .btn-primary { background: var(--accent); border-color: rgba(27,31,35,0.15); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--neutral); color: var(--text); }
    .btn-secondary:hover { background: var(--neutral-hover); }

    main { position: relative; }
    #log {
      position: relative;
      margin: 0;
      width: 100%;
      min-height: 320px;
      height: 60vh;
      box-sizing: border-box;
      overflow: auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: "Droid Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #log::-webkit-scrollbar { width: 8px; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    #log:empty::before {
      content: "No output yet. Import an .rbxm / .rbxmx file to convert it to .anim";
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>RBXM2ANIM</h1>
      <p>Convert .rbxm / .rbxmx files into .anim</p>
    </div>
    <div class="actions">
      <label class="btn btn-primary" for="f">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import .rbxm
        <input type="file" id="f" accept=".rbxm,.rbxmx" multiple hidden>
      </label>
      <a class="btn btn-secondary" href="index2.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Anim Preview
      </a>
    </div>
  </header>
  <main>
    <pre id="log"></pre>
  </main>
	<script src="./pyodide/pyodide.js"></script>
	<script type="module">
		const log = document.getElementById("log");
		const print = s => log.textContent += s + "\n";
		let pyo;
		async function GP() {
			if (pyo) return pyo;
			pyo = await loadPyodide();
			pyo.setStdout({ batched: print });
			pyo.setStderr({ batched: print });
			pyo.runPython(await (await fetch("converter.py")).text());
			return pyo;
		}
		const pyodide = await GP()
		document.getElementById("f").onchange = async e => {
			const files = e.target.files;
			if (!files.length) return;
			for (const file of files) {
			const buf = new Uint8Array(await file.arrayBuffer());
			const result = pyodide.globals.get("main")(pyodide.toPy(buf), undefined);
			if (result.get("status") === "pick") {
				const options = result.get("options").toJs({ create_proxies: false });
				const i = prompt("YOUR selection:\n" + options.map((o, i) => `${i}: ${o.get("name")}`).join("\n"));
				const idx = parseInt(i);
				if (i === null || isNaN(idx)) continue;
				download(pyodide.globals.get("main")(pyodide.toPy(buf), idx).get("data"), file.name);
			} else if (result.get("status") === "Error") {
				print(result.get("error"));
				continue;
			} else {
				download(result.get("data"), file.name);
			}
			}
		};
		function download(bytes, filename) {
    		const a = document.createElement("a");
    		a.href = URL.createObjectURL(new Blob([bytes.toJs()], { type: "application/octet-stream" }));
    		a.download = filename.replace(/\.[^.]+$/, "") + ".anim";
    		a.click();
    		print(a.download);
		}
	</script>
</body>
</html>
